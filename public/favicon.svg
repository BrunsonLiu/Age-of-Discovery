<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 羊皮纸圆角底 -->
  <rect width="64" height="64" rx="10" fill="#3a2817"/>
  <rect x="2" y="2" width="60" height="60" rx="9" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.6"/>

  <!-- 帆船 -->
  <g transform="translate(32 32)">
    <!-- 船体 -->
    <path d="M-18 4 Q-16 12 0 14 Q16 12 18 4 L14 0 L-14 0 Z" fill="#8b5a2b" stroke="#3a2817" stroke-width="1"/>
    <!-- 船体装饰条 -->
    <path d="M-15 2 L15 2" stroke="#c9a96e" stroke-width="0.8"/>
    <!-- 桅杆 -->
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#5a3e1a" stroke-width="1.5"/>
    <!-- 主帆 -->
    <path d="M1 -20 Q14 -14 1 -2 L1 -20 Z" fill="#e8d5a8" stroke="#8b6f3e" stroke-width="0.6"/>
    <!-- 前帆 -->
    <path d="M-1 -16 Q-9 -12 -1 -3 L-1 -16 Z" fill="#d4b884" stroke="#8b6f3e" stroke-width="0.6"/>
    <!-- 桅顶旗 -->
    <path d="M0 -22 L4 -20 L0 -19 Z" fill="#c93030" stroke="#5a1a1a" stroke-width="0.4"/>
    <!-- 船头装饰 -->
    <path d="M-14 0 L-18 4 L-14 4 Z" fill="#c9a96e"/>
    <path d="M14 0 L18 4 L14 4 Z" fill="#c9a96e"/>
  </g>

  <!-- 底部波浪 -->
  <path d="M8 52 Q16 50 24 52 T40 52 T56 52" stroke="#5a7a8a" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M8 56 Q16 54 24 56 T40 56 T56 56" stroke="#5a7a8a" stroke-width="1" fill="none" opacity="0.4"/>
</svg>
