<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>航海图 · 待办清单</title>
<style>

  body{margin:0;background:var(--bg);color:var(--ink);

  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 64px}

  .summary{display:flex;align-items:baseline;gap:14px;margin:20px 0 10px;flex-wrap:wrap}
  .summary b{font-size:22px;color:var(--accent)}
  .bar{height:8px;background:#e4d7bd;border-radius:5px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px;

  button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);

  button:hover{border-color:var(--gold)}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  section{margin:0 0 26px}

  section h2 small{color:var(--muted);font-size:12px;font-weight:400}
  .item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:8px;padding:12px 14px;margin-bottom:8px}
  .item.done{opacity:.62}
  .item.done .t{text-decoration:line-through}
  .item input[type=checkbox]{margin-top:5px;width:17px;height:17px;flex:0 0 auto;accent-color:var(--accent)}
  .body{flex:1;min-width:0}
  .t{font-size:14.5px;font-weight:600;line-height:1.5}
  .chips{display:inline-flex;gap:6px;margin-left:8px;vertical-align:2px;flex-wrap:wrap}
  .chip{font-size:11px;padding:1px 7px;border-radius:10px;line-height:1.7;white-space:nowrap}
  .p0{background:var(--p0-bg);color:var(--p0-ink)}
  .p1{background:var(--p1-bg);color:var(--p1-ink)}
  .p2{background:var(--p2-bg);color:var(--p2-ink)}
  .fz{background:#e4e7ea;color:var(--freeze)}
  .vd{background:#dcebdc;color:var(--done)}
  .vb{background:#f6e2cf;color:#8a4a16}
  .vp{background:#e3e9ef;color:#37536b}
  .why{margin:6px 0 0;color:#4b3d2a;font-size:13px}
  .acc{margin:4px 0 0;color:var(--accent);font-size:12.5px}
  .acc b,.src b{font-weight:600}
  .src{margin:3px 0 0;color:var(--muted);font-size:12px}
  .freeze-mark{flex:0 0 auto;align-self:flex-start;font-size:11px;color:var(--freeze);
    border:1px dashed #aab0b8;border-radius:4px;padding:1px 6px;margin-top:2px}
  .add{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .add input{flex:1;min-width:220px;font-family:inherit;font-size:13px;padding:7px 10px;

    border-radius:6px;background:var(--card);color:var(--ink)}
  footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12px}

    .wrap{padding:18px 12px 48px} header h1{font-size:21px}

</head>
<body>
<div class="wrap">
  <header>
    <h1>航海图 · 待办清单</h1>
    <p>依据 30 轮工作日志整理 · 2026-11-06 逐条复核并实做 · 勾选状态只存本机浏览器</p>
  </header>

  <div class="summary"><b id="count">0 / 0</b><span id="hint">已完成 / 可执行项（已核实的自动勾上；冻结项不计）</span></div>
  <div class="bar"><i id="bar"></i></div>

  <div class="toolbar" id="filters">
    <button data-f="all" class="on">全部</button>
    <button data-f="todo">未完成</button>
    <button data-f="done">已完成</button>
    <button data-f="freeze">明确不做</button>
    <span class="spacer"></span>
    <button id="export">导出 Markdown</button>
    <button id="reset">重置勾选</button>
  </div>

  <main id="list"></main>

  <div class="add">
    <input id="newText" type="text" placeholder="补一条自己的待办…">
    <select id="newGroup"></select>
    <button id="add">添加</button>
  </div>

  <footer>
    数据来自 .workbuddy/memory/ 与 test/e2e/README.md；「明确不做」是已被实测否掉的方向，不计入进度，别再重开。
    本页是纯静态文件，不联网、不上传。
  </footer>
</div>

const KEY = 'aod-todolist-v1'
let state = { done:{}, custom:[] }
try { const s = JSON.parse(localStorage.getItem(KEY) || '{}'); if (s && typeof s === 'object') state = { done:s.done||{}, custom:Array.isArray(s.custom)?s.custom:[] } } catch(e) {}
let filter = 'all'

const all = () => ITEMS.map((x,i) => {
  const v = VERIFIED[x.t] || ''
  // 复核判定「按证据不做」的条目并进冻结组，不计进度、不给勾选
  return { ...x, id:'b'+i, v, g: v === 'frozen' ? 'never' : x.g }
}).concat(state.custom)
// 已核实的条目首次打开就勾上；用户手动取消过（false）则尊重取消
for (const x of all()) if (x.v === 'done' && state.done[x.id] === undefined) state.done[x.id] = true
// file:// 下部分浏览器会禁掉 localStorage；存不了也要能正常勾选（只是刷新后不保留）
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)) } catch(e) {} }
const isFrozen = x => GROUPS.find(g => g.id === x.g)?.frozen
const actionable = () => all().filter(x => !isFrozen(x))

function render(){
  const list = document.getElementById('list')
  const items = all().filter(x => {
    if (filter === 'todo')   return !isFrozen(x) && !state.done[x.id]
    if (filter === 'done')   return !isFrozen(x) &&  state.done[x.id]
    if (filter === 'freeze') return isFrozen(x)
    return true
  })
  list.innerHTML = GROUPS.map(g => {
    const rows = items.filter(x => x.g === g.id)
    if (!rows.length) return ''
    return '<section><h2>' + g.name + '<small>' + g.note + ' · ' + rows.length + ' 条</small></h2>' +
      rows.map(x => {
        const fz = isFrozen(x), done = !!state.done[x.id]
        const chip = fz ? '<span class="chip fz">冻结</span>'
          : '<span class="chip ' + (x.p||'p2').toLowerCase() + '">' + (x.p||'P2') + '</span>'
        const v = x.v || ''
        const vChip = fz ? '' : (v === 'done' ? '<span class="chip vd">已核实完成</span>'
          : v === 'blocked' ? '<span class="chip vb">需你 / 等素材</span>'
          : v === 'partial' ? '<span class="chip vp">部分完成</span>' : '')
        const note = NOTES[x.t]
          ? ' <span style="color:var(--accent)">【复核】' + esc(NOTES[x.t]) + '</span>' : ''
        return '<div class="item' + (done?' done':'') + '">' +
          (fz ? '<span class="freeze-mark">不做</span>' :
            '<input type="checkbox" data-id="' + x.id + '"' + (done?' checked':'') + '>') +
          '<div class="body"><div><span class="t">' + esc(x.t) + '</span><span class="chips">' + chip + vChip + '</span></div>' +
          '<p class="why">' + esc(x.why||'') + note + '</p>' +
          '<p class="acc"><b>验收：</b>' + esc(x.acc||'') + '</p>' +
          '<p class="src"><b>来源：</b>' + esc(x.src||'—') + '</p></div></div>'
      }).join('') + '</section>'
  }).join('') || '<p style="color:var(--muted)">这个筛选下没有条目。</p>'

  list.querySelectorAll('input[type=checkbox]').forEach(el => {
    el.addEventListener('change', () => {
      state.done[el.dataset.id] = el.checked
      save(); render()
    })
  })

  const act = actionable(), n = act.filter(x => state.done[x.id]).length
  document.getElementById('count').textContent = n + ' / ' + act.length
  document.getElementById('bar').style.width = (act.length ? n/act.length*100 : 0) + '%'
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]'); if (!b) return
  filter = b.dataset.f
  document.querySelectorAll('#filters button[data-f]').forEach(x => x.classList.toggle('on', x === b))
  render()
})

const sel = document.getElementById('newGroup')
sel.innerHTML = GROUPS.filter(g => !g.frozen).map(g => '<option value="' + g.id + '">' + g.name + '</option>').join('')
function addItem(){
  const el = document.getElementById('newText'), t = el.value.trim()
  if (!t) return
  state.custom.push({ id:'c'+Date.now(), g:sel.value, p:'P2', t,
    why:'自己补的待办', acc:'自己定验收判据', src:'手动添加' })
  el.value = ''; save(); render()
}
document.getElementById('add').addEventListener('click', addItem)
document.getElementById('newText').addEventListener('keydown', e => { if (e.key === 'Enter') addItem() })

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('清空所有勾选与手动添加的条目？')) return
  state = { done:{}, custom:[] }; save(); render()
})

document.getElementById('export').addEventListener('click', () => {
  const lines = ['# 航海图 · 待办清单', '', '依据 30 轮工作日志整理 · ' + new Date().toLocaleDateString('zh-CN'), '']
  GROUPS.forEach(g => {
    const rows = all().filter(x => x.g === g.id)
    if (!rows.length) return
    lines.push('## ' + g.name, '')
    rows.forEach(x => {
      const mark = isFrozen(x) ? '[不做] ' : (state.done[x.id] ? '[x] ' : '[ ] ')
      lines.push('- ' + mark + '**' + (x.p||'P2') + '** ' + x.t)
      lines.push('  - ' + (x.why||'') + ' 验收：' + (x.acc||'') + '（' + (x.src||'') + '）')
    })
    lines.push('')
  })
  const blob = new Blob([lines.join('\n')], { type:'text/markdown;charset=utf-8' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob); a.download = '航海图-todolist.md'; a.click()
  setTimeout(() => URL.revokeObjectURL(a.href), 1000)
})

render()
</script>
</body>
</html>
